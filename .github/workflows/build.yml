name: Build and Release EXE

on:
  workflow_dispatch:
  push: 

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Pre-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          python main.py
        shell: pwsh
        continue-on-error: true

      - name: Read config values
        id: config
        run: |
          $appName = python -c "from config import APP_NAME; print(APP_NAME)"
          $versionRaw = python -c "from config import APP_VERSION; print(APP_VERSION)"
          if ($versionRaw -match 'v\d+(\.\d+)*(\s+(Beta|Alpha|RC)\d*)?') {
            $ver = $Matches[0] -replace '\s+', '_'
          } else {
            $ver = $versionRaw -replace '\s+', '_'
          }
          $tag = $ver
          Write-Host "APP_NAME=$appName"
          Write-Host "APP_VERSION=$ver"
          Write-Host "TAG=$tag"
          "app_name=$appName" >> $env:GITHUB_OUTPUT
          "app_version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Check if tag exists
        run: |
          $tag = "${{ steps.config.outputs.tag }}"
          git fetch --tags
          $existing = git tag -l $tag
          if ($existing) {
            Write-Error "Tag $tag already exists. Bump version in config.py before building."
            exit 1
          }
        shell: pwsh

      - name: Build EXE (via build.py)
        run: python build.py
        shell: pwsh

      - name: Debug - inspect dist and config names
        run: |
          Write-Host "=== config names ==="
          python -c "from config import APP_NAME, SOURCE_NAME, APP_VERSION; print('APP_NAME    =', APP_NAME); print('SOURCE_NAME =', SOURCE_NAME); print('APP_VERSION =', APP_VERSION)"
          Write-Host "=== dist/ contents ==="
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse | Format-Table FullName, Length -AutoSize
          } else {
          Write-Host "dist/ 不存在"
          }
          Write-Host "=== cwd ==="
          Get-Location
        shell: pwsh

      - name: Post-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          $exeName = "${{ steps.config.outputs.app_name }}.exe"
          $exe = Get-ChildItem -Path dist -Filter "$appName*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No EXE matching '$appName*.exe' found in dist/"
            Get-ChildItem -Path dist -Recurse | Format-Table FullName
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          & $exe.FullName
        shell: pwsh

      - name: Locate built EXE
        id: exe
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No EXE found in dist/"
            if (Test-Path dist) { Get-ChildItem -Path dist -Recurse | Format-Table FullName }
            exit 1
           }
           Write-Host "EXE_NAME=$($exe.Name)"
           "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
           "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.exe.outputs.exe_name }}
          path: dist/${{ steps.exe.outputs.exe_name }}

      - name: Create tag and release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          name: ${{ steps.config.outputs.app_version }}
          files: dist/${{ steps.exe.outputs.exe_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
